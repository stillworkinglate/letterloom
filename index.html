<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#10301f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Letterloom">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Letterloom</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/large-print.css">
</head>
<body>
  <div id="app"></div>
  <script src="js/engine.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/offline.js"></script>
  <script src="js/online.js"></script>
  <script src="js/ui.js"></script>
  <script>
    // Online play needs the relay in relay/ deployed (see relay/README.md).
    // Paste its address here, ending in /api/room. While this is empty, the
    // Play online choice stays hidden.
    var RELAY_URL = 'https://letterloom-relay.vercel.app/api/room';
    var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

    LetterloomOffline.register('sw.js');
    LetterloomUI.mount(document.getElementById('app'), {
      dictionaryUrls: {
        en: 'data/words.txt',
        es: 'data/words.es.txt'
      },
      // On your own machine, `node relay/dev-server.js` stands in for the relay.
      relayUrl: isLocal ? 'http://localhost:8787/api/room' : RELAY_URL
    });
  </script>
</body>
</html>
